<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#060B14"/>
  <!-- Emerald glow -->
  <ellipse cx="16" cy="13" rx="13" ry="11" fill="#10B981" opacity="0.13"/>
  <!-- VB chevron mark – main V shape -->
  <path d="M4.5 8 L12.5 23 L16 17.5 L19.5 23 L27.5 8"
        fill="none" stroke="#10B981" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left arm tread marks -->
  <line x1="5.8" y1="10.8" x2="9.2" y2="10.8" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="7.8" y1="14.8" x2="10.8" y2="14.8" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Right arm tread marks -->
  <line x1="21.2" y1="14.8" x2="24.2" y2="14.8" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="22.8" y1="10.8" x2="26.2" y2="10.8" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Bottom dot (fuel drop / brand accent) -->
  <circle cx="16" cy="26" r="1.4" fill="#10B981" opacity="0.8"/>
</svg>
